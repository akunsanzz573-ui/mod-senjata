name: Extract ZIP and Run Action

on:
  push:
    branches:
      - main  # Ganti ke master jika nama branch utama Anda 'master'
    paths:
      - 'legendary-elemental-arsenal-1.21.11-project.zip'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil file dari repositori ke server Actions
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Mengekstrak file ZIP spesifik Anda
      - name: Ekstrak File ZIP
        run: |
          unzip legendary-elemental-arsenal-1.21.11-project.zip -d hasil_ekstrak/

      # 3. Menampilkan isi folder untuk memastikan ekstrak berhasil
      - name: Cek Hasil Ekstrak
        run: |
          cd hasil_ekstrak/
          ls -la
          
